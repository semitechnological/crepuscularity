[package]
name = "tree-sitter-crepusx"
description = "CrepusX grammar for tree-sitter"
version = "0.0.1"
license = "MPL-2.0"
readme = "README.md"
keywords = ["incremental", "parsing", "tree-sitter", "crepusx"]
categories = ["parsing", "text-editors"]
repository = "https://github.com/tschk/crepuscularity/tree-sitter-crepusx"
edition = "2021"
autoexamples = false

build = "bindings/rust/build.rs"
include = ["README.md", "bindings/rust/*", "grammar.js", "queries/*", "src/*"]

[lib]
path = "bindings/rust/lib.rs"

[dependencies]
tree-sitter = ">=0.22.6"

[build-dependencies]
cc = "1.0.87"
