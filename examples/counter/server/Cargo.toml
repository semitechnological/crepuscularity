[package]
name = "counter-server"
version = "0.1.0"
edition = "2021"
license = "ISC"

[[bin]]
name = "counter-server"
path = "src/main.rs"

[dependencies]
crepuscularity-web = { path = "../../../crates/crepuscularity-web", features = ["hydration"] }
axum = "0.7"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }

crepuscularity-core = { path = "../../../crates/crepuscularity-core" }
[workspace]
