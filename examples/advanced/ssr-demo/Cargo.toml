[workspace]

[package]
name = "ssr-demo"
version = "0.1.0"
edition = "2021"
license = "ISC"

[[bin]]
name = "ssr-demo"
path = "src/main.rs"

[dependencies]
crepuscularity-web = { path = "../../../crates/crepuscularity-web", default-features = true }
crepuscularity-core = { path = "../../../crates/crepuscularity-core" }
axum = "0.7"
tokio = { version = "1", features = ["full"] }
chrono = { version = "0.4", features = ["clock"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
