# Declarative compare harness for `crepus benchmark`.
#
# External stacks use **checked-in apps** under `examples/benchmarks/apps/` (and `starters/`
# for Dioxus + webext-vanilla). Steps only run installs/builds there — no `create-*` scaffolds
# at benchmark time (avoids non-TTY CLI issues and keeps comparisons stable).
#
# JS/TS: **Bun** (`bun install`, `bun run …`). Commit **lockfiles** only — never `node_modules`.
#
# .NET: prefer **Wax** (`wax install dotnet`) or Microsoft SDK. Homebrew’s `bin/dotnet` shim
# often embeds `@@HOMEBREW_CELLAR@@`; the steps below fall back to
# `Cellar/dotnet/*/libexec/dotnet` + `DOTNET_ROOT`. Override with `DOTNET_BIN` if needed.
#
# Run from repo root:
#   crepus benchmark all
#   crepus benchmark check --config examples/benchmarks/benchmark.toml
#
# Step `cwd` may use `$REPO` (repo root), `$WORK` (per-target work dir), `$TARGET`.

version = 1

[settings]
work_root = "examples/benchmarks/.work"

# --- Crepuscularity (timed via this CLI; output still under .work) -----------------

[[targets]]
suite = "web"
id = "crepus-web"
label = "Crepuscularity (.crepus + WASM)"
optional = false
builtin = "crepus-web"
site = "examples/benchmarks/crepus-web"

[[targets]]
suite = "webext"
id = "crepus-webext"
label = "Crepuscularity webext"
optional = false
builtin = "crepus-webext"

[[targets]]
suite = "desktop"
id = "crepus-desktop"
label = "Crepuscularity (GPUI desktop)"
optional = true
builtin = "crepus-desktop"

# --- Web: production builds in repo app dirs --------------------------------------

[[targets]]
suite = "web"
id = "nextjs"
label = "Next.js (App Router)"
optional = true

[[targets.steps]]
name = "next-build"
cwd = "$REPO/examples/benchmarks/apps/nextjs"
shell = "bun install && bun run build"

[[targets]]
suite = "web"
id = "svelte"
label = "Svelte (Vite + TS)"
optional = true

[[targets.steps]]
name = "svelte-build"
cwd = "$REPO/examples/benchmarks/apps/svelte"
shell = "bun install && bun run build"

[[targets]]
suite = "web"
id = "solid"
label = "Solid (Vite + TS)"
optional = true

[[targets.steps]]
name = "solid-build"
cwd = "$REPO/examples/benchmarks/apps/solid"
shell = "bun install && bun run build"

[[targets]]
suite = "web"
id = "vue"
label = "Vue (Vite + TS)"
optional = true

[[targets.steps]]
name = "vue-build"
cwd = "$REPO/examples/benchmarks/apps/vue"
shell = "bun install && bun run build"

[[targets]]
suite = "web"
id = "angular"
label = "Angular (CLI defaults)"
optional = true

[[targets.steps]]
name = "ng-build"
cwd = "$REPO/examples/benchmarks/apps/angular"
shell = "bun install && bun run build -- --configuration production"

[[targets]]
suite = "web"
id = "vanilla"
label = "Vanilla (Vite + TS)"
optional = true

[[targets.steps]]
name = "vanilla-build"
cwd = "$REPO/examples/benchmarks/apps/vanilla"
shell = "bun install && bun run build"

[[targets]]
suite = "web"
id = "leptos"
label = "Leptos (start-axum, cargo-leptos)"
optional = true

[[targets.steps]]
name = "leptos-build"
cwd = "$REPO/examples/benchmarks/apps/leptos"
shell = "if command -v cargo-leptos >/dev/null 2>&1; then cargo leptos build --release; else echo 'install cargo-leptos: cargo install cargo-leptos --locked' && exit 1; fi"

[[targets]]
suite = "web"
id = "dioxus"
label = "Dioxus web (starter + dx build)"
optional = true

[[targets.steps]]
name = "dx-build"
cwd = "$REPO/examples/benchmarks/starters/dioxus-web"
shell = "if command -v dx >/dev/null 2>&1; then dx build --platform web --release; else echo 'install dioxus-cli: cargo install dioxus-cli --locked' && exit 1; fi"

# --- Desktop GUIs (repo app dirs) ------------------------------------------------

[[targets]]
suite = "desktop"
id = "electron"
label = "Electron (electron-vite, vanilla-ts)"
optional = true

[[targets.steps]]
name = "electron-build"
cwd = "$REPO/examples/benchmarks/apps/electron"
shell = "bun install && bun run build"

[[targets]]
suite = "desktop"
id = "tauri"
label = "Tauri 2 (vanilla + TS)"
optional = true

[[targets.steps]]
name = "tauri-build"
cwd = "$REPO/examples/benchmarks/apps/tauri"
shell = "bun install && bun run tauri build"

[[targets]]
suite = "desktop"
id = "dotnet-avalonia"
label = ".NET Avalonia (desktop)"
optional = true

[[targets.steps]]
name = "dotnet-build"
cwd = "$REPO/examples/benchmarks/apps/avalonia-app"
shell = "export PATH=\"${HOME}/.local/wax/bin:${HOME}/.local/bin:${PATH}\"; if [ -n \"${DOTNET_BIN:-}\" ] && [ -x \"${DOTNET_BIN}\" ]; then :; elif [ -x \"${HOME}/.dotnet/dotnet\" ]; then DOTNET_BIN=\"${HOME}/.dotnet/dotnet\"; export DOTNET_ROOT=\"${DOTNET_ROOT:-$(dirname \"$DOTNET_BIN\")}\"; elif [ -x /usr/local/share/dotnet/dotnet ]; then DOTNET_BIN=/usr/local/share/dotnet/dotnet; export DOTNET_ROOT=\"${DOTNET_ROOT:-/usr/local/share/dotnet}\"; else DOTNET_BIN=\"\"; for _base in /opt/homebrew/Cellar/dotnet /usr/local/Cellar/dotnet; do [ -d \"$_base\" ] || continue; for _c in \"$_base\"/*/libexec/dotnet; do if [ -x \"$_c\" ]; then DOTNET_BIN=\"$_c\"; export DOTNET_ROOT=\"$(dirname \"$_c\")\"; break 2; fi; done; done; [ -z \"$DOTNET_BIN\" ] && DOTNET_BIN=dotnet; fi; \"$DOTNET_BIN\" build -c Release"

# --- Web extensions ----------------------------------------------------------------

[[targets]]
suite = "webext"
id = "vanilla-vite"
label = "Vanilla MV3 (Vite + crxjs)"
optional = true

[[targets.steps]]
name = "vite-crx-build"
cwd = "$REPO/examples/benchmarks/starters/webext-vanilla"
shell = "bun install && bun run build"

[[targets]]
suite = "webext"
id = "plasmo"
label = "Plasmo (with-popup example)"
optional = true

[[targets.steps]]
name = "plasmo-build"
cwd = "$REPO/examples/benchmarks/apps/plasmo"
shell = "bun install && bun run build"
