# Declarative compare harness for `crepus benchmark`.
# JS/TS stacks use **Bun** (`bun`, `bunx`) for installs and scaffolds — not npm.
# .NET SDK should come from **Wax** (`wax install dotnet`) or Microsoft (`~/.dotnet`),
# not raw Homebrew `brew install dotnet` (wrapper can break with `@@HOMEBREW_CELLAR@@`).
# Built-in *crepus* rows time the checked-in fixtures under this folder.
#
# Run everything from repo root:
#   crepus benchmark all
#   ./examples/benchmarks/run-all.sh
#   crepus benchmark --config examples/benchmarks/benchmark.toml
#
# Quick check (fixtures only, no JS):
#   crepus benchmark --config examples/benchmarks/benchmark.toml --only crepus-web,crepus-webext
#
# Probe system CLIs (including `bun`) for selected targets — no builds:
#   crepus benchmark check --config examples/benchmarks/benchmark.toml
#
# Reading results:
#   Human runs end with a consolidated summary (ratatui dashboard on TTY).
#   `crepus benchmark --json` emits `summary.by_wall_time` for charts/spreadsheets.

version = 1

[settings]
# Resolved relative to the repo root when not absolute
work_root = "examples/benchmarks/.work"

# .NET steps prepend Wax + ~/.local/bin to PATH and prefer ~/.dotnet/dotnet (set DOTNET_BIN to override).

# --- Crepuscularity (timed via this CLI) ------------------------------------

[[targets]]
suite = "web"
id = "crepus-web"
label = "Crepuscularity (.crepus + WASM)"
optional = false
builtin = "crepus-web"
site = "examples/benchmarks/crepus-web"

[[targets]]
suite = "webext"
id = "crepus-webext"
label = "Crepuscularity webext"
optional = false
builtin = "crepus-webext"

[[targets]]
suite = "desktop"
id = "crepus-desktop"
label = "Crepuscularity (GPUI desktop)"
optional = true
builtin = "crepus-desktop"

# --- Web: production / static builds ----------------------------------------

[[targets]]
suite = "web"
id = "nextjs"
label = "Next.js (App Router)"
optional = true

[[targets.steps]]
name = "create-next-app"
shell = "rm -rf next-app && CI=1 bunx --bun create-next-app@15 next-app --typescript --eslint --tailwind --app --src-dir --import-alias \"@/*\" --turbopack false --use-bun"

[[targets.steps]]
name = "next-build"
cwd = "next-app"
shell = "bun install && bun run build"

[[targets]]
suite = "web"
id = "svelte"
label = "Svelte (Vite + TS)"
optional = true

[[targets.steps]]
name = "vite-create-svelte"
shell = "rm -rf svelte-app && bun create vite svelte-app --template svelte-ts"

[[targets.steps]]
name = "svelte-build"
cwd = "svelte-app"
shell = "bun install && bun run build"

[[targets]]
suite = "web"
id = "solid"
label = "Solid (Vite + TS)"
optional = true

[[targets.steps]]
name = "vite-create-solid"
shell = "rm -rf solid-app && bun create vite solid-app --template solid-ts"

[[targets.steps]]
name = "solid-build"
cwd = "solid-app"
shell = "bun install && bun run build"

[[targets]]
suite = "web"
id = "vue"
label = "Vue (Vite + TS)"
optional = true

[[targets.steps]]
name = "vite-create-vue"
shell = "rm -rf vue-app && bun create vite vue-app --template vue-ts"

[[targets.steps]]
name = "vue-build"
cwd = "vue-app"
shell = "bun install && bun run build"

[[targets]]
suite = "web"
id = "angular"
label = "Angular (CLI defaults)"
optional = true

[[targets.steps]]
name = "ng-new"
shell = "rm -rf ng-app && CI=1 NG_CLI_ANALYTICS=false bunx --bun @angular/cli@19 new ng-app --defaults --skip-git --style=css --ssr=false --strict --package-manager=bun"

[[targets.steps]]
name = "ng-build"
cwd = "ng-app"
shell = "bun install && bun run build -- --configuration production"

[[targets]]
suite = "web"
id = "vanilla"
label = "Vanilla (Vite + TS)"
optional = true

[[targets.steps]]
name = "vite-create-vanilla"
shell = "rm -rf vanilla-app && bun create vite vanilla-app --template vanilla-ts"

[[targets.steps]]
name = "vanilla-build"
cwd = "vanilla-app"
shell = "bun install && bun run build"

[[targets]]
suite = "web"
id = "leptos"
label = "Leptos (start-axum, cargo-leptos)"
optional = true

[[targets.steps]]
name = "clone-start-axum"
shell = "rm -rf leptos-app && git clone --depth 1 https://github.com/leptos-rs/start-axum leptos-app"

[[targets.steps]]
name = "leptos-build"
cwd = "leptos-app"
shell = "if command -v cargo-leptos >/dev/null 2>&1; then cargo leptos build --release; else echo 'install cargo-leptos: cargo install cargo-leptos --locked' && exit 1; fi"

[[targets]]
suite = "web"
id = "dioxus"
label = "Dioxus web (starter + dx build)"
optional = true

[[targets.steps]]
name = "copy-starter"
shell = "rm -rf dioxus-app && cp -R \"$REPO/examples/benchmarks/starters/dioxus-web\" dioxus-app"

[[targets.steps]]
name = "dx-build"
cwd = "dioxus-app"
shell = "if command -v dx >/dev/null 2>&1; then dx build --platform web --release; else echo 'install dioxus-cli: cargo install dioxus-cli --locked' && exit 1; fi"

# --- Desktop GUIs -----------------------------------------------------------

[[targets]]
suite = "desktop"
id = "electron"
label = "Electron (electron-vite, vanilla-ts)"
optional = true

[[targets.steps]]
name = "create-electron"
shell = "rm -rf electron-app && bun create electron-vite@latest electron-app -- --template vanilla-ts"

[[targets.steps]]
name = "electron-build"
cwd = "electron-app"
shell = "bun install && bun run build"

[[targets]]
suite = "desktop"
id = "tauri"
label = "Tauri 2 (vanilla + TS, CI scaffold)"
optional = true

[[targets.steps]]
name = "create-tauri"
shell = "rm -rf tauri-app && bun create tauri-app@latest tauri-app -- --template vanilla-ts"

[[targets.steps]]
name = "tauri-build"
cwd = "tauri-app"
shell = "bun install && bun run tauri build"

[[targets]]
suite = "desktop"
id = "dotnet-avalonia"
label = ".NET Avalonia (desktop)"
optional = true

[[targets.steps]]
name = "dotnet-new"
shell = "rm -rf avalonia-app && export PATH=\"${HOME}/.local/wax/bin:${HOME}/.local/bin:${PATH}\" && DOTNET_BIN=\"${DOTNET_BIN:-}\" && if [ -z \"$DOTNET_BIN\" ]; then if [ -x \"${HOME}/.dotnet/dotnet\" ]; then DOTNET_BIN=\"${HOME}/.dotnet/dotnet\"; elif [ -x /usr/local/share/dotnet/dotnet ]; then DOTNET_BIN=/usr/local/share/dotnet/dotnet; else DOTNET_BIN=dotnet; fi; fi && \"$DOTNET_BIN\" new install Avalonia.Templates >/dev/null 2>&1; \"$DOTNET_BIN\" new avalonia.app -o avalonia-app"

[[targets.steps]]
name = "dotnet-build"
cwd = "avalonia-app"
shell = "export PATH=\"${HOME}/.local/wax/bin:${HOME}/.local/bin:${PATH}\" && DOTNET_BIN=\"${DOTNET_BIN:-}\" && if [ -z \"$DOTNET_BIN\" ]; then if [ -x \"${HOME}/.dotnet/dotnet\" ]; then DOTNET_BIN=\"${HOME}/.dotnet/dotnet\"; elif [ -x /usr/local/share/dotnet/dotnet ]; then DOTNET_BIN=/usr/local/share/dotnet/dotnet; else DOTNET_BIN=dotnet; fi; fi && \"$DOTNET_BIN\" build -c Release"

[[targets]]
suite = "desktop"
id = "dotnet-maui"
label = ".NET MAUI (workloads required)"
optional = true

[[targets.steps]]
name = "dotnet-maui-new"
shell = "rm -rf maui-app && export PATH=\"${HOME}/.local/wax/bin:${HOME}/.local/bin:${PATH}\" && DOTNET_BIN=\"${DOTNET_BIN:-}\" && if [ -z \"$DOTNET_BIN\" ]; then if [ -x \"${HOME}/.dotnet/dotnet\" ]; then DOTNET_BIN=\"${HOME}/.dotnet/dotnet\"; elif [ -x /usr/local/share/dotnet/dotnet ]; then DOTNET_BIN=/usr/local/share/dotnet/dotnet; else DOTNET_BIN=dotnet; fi; fi && \"$DOTNET_BIN\" new maui -n maui-app -f net9.0"

[[targets.steps]]
name = "dotnet-maui-build"
cwd = "maui-app"
shell = "export PATH=\"${HOME}/.local/wax/bin:${HOME}/.local/bin:${PATH}\" && DOTNET_BIN=\"${DOTNET_BIN:-}\" && if [ -z \"$DOTNET_BIN\" ]; then if [ -x \"${HOME}/.dotnet/dotnet\" ]; then DOTNET_BIN=\"${HOME}/.dotnet/dotnet\"; elif [ -x /usr/local/share/dotnet/dotnet ]; then DOTNET_BIN=/usr/local/share/dotnet/dotnet; else DOTNET_BIN=dotnet; fi; fi && \"$DOTNET_BIN\" build -c Release"

# --- Web extensions -----------------------------------------------------------

[[targets]]
suite = "webext"
id = "vanilla-vite"
label = "Vanilla MV3 (Vite + crxjs)"
optional = true

[[targets.steps]]
name = "copy-vanilla-starter"
shell = "rm -rf vanilla-ext && cp -R \"$REPO/examples/benchmarks/starters/webext-vanilla\" vanilla-ext"

[[targets.steps]]
name = "vite-crx-build"
cwd = "vanilla-ext"
shell = "bun install && bun run build"

[[targets]]
suite = "webext"
id = "plasmo"
label = "Plasmo"
optional = true

[[targets.steps]]
name = "create-plasmo"
shell = "rm -rf plasmo-app && CI=1 bunx create-plasmo@latest plasmo-app"

[[targets.steps]]
name = "plasmo-build"
cwd = "plasmo-app"
shell = "bun install && bun run build"
