[extension]
name = "vimium-crepus"
version = "0.2.0"
description = "Vimium-style keyboard navigation — port of philc/vimium to crepuscularity webext."

[capabilities]
tabs = true
storage = true
sessions = true
bookmarks = true
history = true
notifications = true
scripting = true
web-navigation = true
search = true
favicon = true
background-script = true
content-script = true
clipboard = true
host-permissions = ["<all_urls>"]

[[content_scripts]]
matches = ["<all_urls>"]
js = ["src/content.js"]
css = ["src/content.css"]
run_at = "document_idle"
all_frames = true
match_about_blank = true

[[content_scripts]]
matches = ["file:///", "file:///*/"]
css = ["src/content.css"]
run_at = "document_idle"
all_frames = true

[options]
content_css = ["src/content.css"]
options_page = "pages/options.html"
action_popup = "pages/action.html"

[web_accessible_resources]
resources = [
    "pages/vomnibar.html",
    "src/content.css",
    "pages/hud.html",
    "pages/help_dialog.html",
    "pages/command_listing.html",
    "resources/tlds.txt",
]

[commands._execute_action]
description = "Open vimium-crepus"

[commands._execute_action.suggested_key]
default = "Alt+Shift+V"
mac = "Alt+Shift+V"