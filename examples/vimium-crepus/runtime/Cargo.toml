[package]
name = "vimium_crepus_runtime"
version = "0.1.0"
edition = "2021"
description = "Vimium-style browser extension example for crepuscularity"

[workspace]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
crepuscularity-core = { path = "../../../crates/crepuscularity-core" }
crepuscularity-web = { path = "../../../crates/crepuscularity-web" }
crepuscularity-webext = { path = "../../../crates/crepuscularity-webext", features = ["wasm"] }
serde_json = "1.0"
serde-wasm-bindgen = "0.6"
wasm-bindgen = "=0.2.117"
wasm-bindgen-futures = "0.4"
once_cell = "1"
