[package]
name = "text-features"
version = "0.1.0"
edition = "2021"
license.workspace = true
publish = false

[[bin]]
name = "text-features"
path = "src/main.rs"

[features]
default = []
# Enable for full tracking/transform demo with a patched gpui checkout.
vendor-gpui-text = ["crepuscularity-gpui/gpui-text-extras"]

[dependencies]
gpui = { workspace = true }
crepuscularity-gpui = { path = "../../crates/crepuscularity-gpui", version = "0.4.6" }
