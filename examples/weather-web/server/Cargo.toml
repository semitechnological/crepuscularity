[package]
name = "weather-web-server"
version = "0.1.0"
edition = "2021"
license = "MPL-2.0"

[[bin]]
name = "weather-web-server"
path = "src/main.rs"

[dependencies]
crepuscularity-web = { path = "../../../crates/crepuscularity-web" }
axum = "0.7"
tokio = { version = "1", features = ["full"] }
crepuscularity-core = { path = "../../../crates/crepuscularity-core" }
reqwest = { version = "0.12", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
urlencoding = "2"

[workspace]
