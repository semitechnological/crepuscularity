[[targets]]
type = "web"
id = "docs"
site = "."
out = "dist"
entry = "index.crepus"

name = "Crepuscularity"
description = "Documentation and landing (crepus web build)"
head_html = """
<link rel="icon" href="./static/favicon.svg" type="image/svg+xml">
"""

[targets.seo]
title = "Crepuscularity"
description = "A multi-target UI framework for GPUI, web, browser extensions, terminal UIs, embedded displays, and native shells."
canonical = "https://crepuscularity.undivisible.dev/"
site_name = "Crepuscularity"
locale = "en_US"
type = "website"
image = "https://crepuscularity.undivisible.dev/static/og.png"
image_alt = "Crepuscularity UI templates preview"
keywords = ["Rust UI", "GPUI", "WASM", "browser extensions", "Ratatui", "embedded UI", "LVGL"]
author = "Max Carter <max@undivisible.dev>"
robots = "index,follow"
theme_color = "#0c0612"
application_name = "Crepuscularity"
generator = "crepuscularity"
twitter_card = "summary_large_image"
json_ld = [
  """{"@context":"https://schema.org","@type":"SoftwareSourceCode","name":"Crepuscularity","codeRepository":"https://github.com/tschk/crepuscularity","programmingLanguage":"Rust","url":"https://crepuscularity.undivisible.dev/"}"""
]

[targets.docs]
command = "cargo"
args = ["run", "--quiet", "--locked", "--manifest-path", "docs-renderer/Cargo.toml", "--"]
src = "../docs"

[[targets.seo.alternates]]
href = "https://crepuscularity.undivisible.dev/"
hreflang = "en"
