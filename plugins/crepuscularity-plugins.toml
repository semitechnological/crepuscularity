[contract]
ir_version = 7
cli = "crepus native ir"
abi_header = "crates/crepuscularity-abi/include/crepuscularity_abi.h"
bindgen = "cargo run -p crepuscularity-cli -- plugins bindgen"

[[package]]
language = "go"
path = "plugins/go"
workspace = "go.work"
test = "go test ./plugins/go/..."

[[package]]
language = "typescript"
runtime = "bun"
path = "plugins/typescript-bun"
workspace = "plugins/package.json"
test = "bun --cwd plugins test"

[[package]]
language = "zig"
path = "plugins/zig"
workspace = "plugins/build.zig"
test = "zig build test --build-file plugins/build.zig"

[[package]]
language = "rust"
path = "plugins/rust"
workspace = "plugins/rust/Cargo.toml"
test = "cargo test --manifest-path plugins/rust/Cargo.toml"

[[package]]
language = "swift"
path = "plugins/swift"
workspace = "plugins/Package.swift"
test = "swift build --package-path plugins"

[[package]]
language = "csharp"
path = "plugins/csharp"
workspace = "plugins/CrepuscularityPlugins.sln"
test = "dotnet build plugins/CrepuscularityPlugins.sln --nologo --verbosity:minimal"

[[package]]
language = "python"
path = "plugins/python"
test = "python3 -m unittest discover plugins/python"

[[package]]
language = "ruby"
path = "plugins/ruby"
test = "ruby -Iplugins/ruby -e 'require \"crepuscularity_plugin\"; v = CrepuscularityPlugin.render_ir(\"plugins/fixtures/hello.crepus\").version; raise unless v >= 4'"

[[package]]
language = "php"
path = "plugins/php"
test = "php -r 'require \"plugins/php/CrepuscularityPlugin.php\"; $ir = CrepuscularityPlugin::renderIr(\"plugins/fixtures/hello.crepus\"); if ($ir[\"version\"] < 4) exit(1);'"

[[package]]
language = "java"
path = "plugins/java"
test = "javac -d /tmp/crepus-java plugins/java/CrepuscularityPlugin.java"

[[package]]
language = "kotlin"
path = "plugins/kotlin"
test = "kotlinc plugins/kotlin/CrepuscularityPlugin.kt -d /tmp/crepus-kotlin"

[[package]]
language = "v"
path = "plugins/v"
test = "v -gc none test plugins/v"

[[package]]
language = "c"
path = "plugins/c"
test = "gcc plugins/c/crepuscularity_plugin.c -o /tmp/crepus-c-smoke && /tmp/crepus-c-smoke plugins/fixtures/hello.crepus"

[[package]]
language = "cpp"
path = "plugins/cpp"
test = "g++ plugins/cpp/crepuscularity_plugin.cpp -std=c++17 -o /tmp/crepus-cpp-smoke && /tmp/crepus-cpp-smoke plugins/fixtures/hello.crepus"
