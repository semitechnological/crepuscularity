id = "crepuscularity"
name = "Crepuscularity"
version = "0.2.0"
schema_version = 1
authors = ["Max Carter <max@undivisible.dev>"]
description = "Crepus templates (.crepus): tree-sitter highlighting, snippets, and crepus-lsp."
repository = "https://github.com/semitechnological/crepuscularity"

snippets = ["./snippets/crepus.json"]

[[capabilities]]
kind = "process:exec"
command = "*"
args = ["**"]

[grammars.crepus]
repository = "https://github.com/semitechnological/crepuscularity"
path = "tree-sitter-crepus"
# Must match a commit on `repository` whose `tree-sitter-crepus/grammar.js` includes every node used by `languages/crepus/*.scm`.
rev = "2371b3cf94e8d7bbcc27fc42f905476b7b2aac5c"

[language_servers.crepus-lsp]
name = "crepus-lsp"
languages = ["Crepus"]
