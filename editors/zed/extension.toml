id = "crepuscularity"
name = "Crepuscularity"
version = "0.1.0"
schema_version = 1
authors = ["Max Carter <max@undivisible.dev>"]
description = "Crepus templates (.crepus): tree-sitter highlighting, snippets, and crepus-lsp."
repository = "https://github.com/semitechnological/crepuscularity"

snippets = ["./snippets/crepus.json"]

[[capabilities]]
kind = "process:exec"
command = "*"
args = ["**"]

[grammars.crepus]
repository = "https://github.com/semitechnological/crepuscularity"
path = "tree-sitter-crepus"
rev = "5f2132a179fed7c2ea03cd0471c7fdbb427a2fc4"

[language_servers.crepus-lsp]
name = "crepus-lsp"
languages = ["Crepus"]
