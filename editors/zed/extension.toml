id = "crepuscularity"
name = "Crepuscularity"
version = "0.3.3"
schema_version = 1
authors = ["Max Carter <max@undivisible.dev>"]
description = "Crepus templates (.crepus) and CrepusX (.csx) for React Native: tree-sitter highlighting, snippets, and crepus-lsp."
repository = "https://github.com/tschk/crepuscularity"

snippets = ["./snippets/crepus.json", "./snippets/csx.json"]

[grammars.crepus]
repository = "https://github.com/tschk/crepuscularity"
path = "tree-sitter-crepus"
# Must match a commit on `repository` whose `tree-sitter-crepus/grammar.js` includes every node used by `languages/crepus/*.scm`.
rev = "0c6309db928b9aba3ea21e283993180a4790b733"

[grammars.crepusx]
repository = "https://github.com/tschk/crepuscularity"
path = "tree-sitter-crepusx"
# Must match a commit on `repository` whose `tree-sitter-crepusx/grammar.js` includes every node used by `languages/csx/*.scm`.
rev = "0c6309db928b9aba3ea21e283993180a4790b733"

[language_servers.crepus-lsp]
name = "crepus-lsp"
languages = ["Crepus", "CrepusX"]
