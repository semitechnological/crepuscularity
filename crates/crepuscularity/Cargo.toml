[package]
name = "crepuscularity"
version = "0.4.5"
edition = "2021"
license = "MPL-2.0"
description = "Crepuscularity UI framework: .crepus templates for GPUI and web (UNSTABLE; in active development)."
repository = "https://github.com/tschk/crepuscularity"
documentation = "https://docs.rs/crepuscularity"
readme = "../../README.md"

[lib]
path = "src/lib.rs"

[dependencies]
crepuscularity-core = { path = "../crepuscularity-core", version = "0.4.15" }
crepuscularity-web = { path = "../crepuscularity-web", version = "0.4.7" }
crepuscularity-native = { path = "../crepuscularity-native", version = "0.4.10" }
crepuscularity-lvgl = { path = "../crepuscularity-lvgl", version = "0.1.4" }
serde = { workspace = true }
toml = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
