[package]
name = "crepuscularity-dev"
version = "0.4.3"
edition = "2021"
license = "MPL-2.0"
description = "crepus-dev hot-reload development server (UNSTABLE; in active development)."
repository = "https://github.com/tschk/crepuscularity"
documentation = "https://docs.rs/crepuscularity-dev"
readme = "../../README.md"

[[bin]]
name = "crepus-dev"
path = "src/main.rs"

[dependencies]
crepuscularity-runtime = { path = "../crepuscularity-runtime", version = "0.4.7" }
gpui = { version = "=0.2.2", default-features = false, features = ["font-kit"] }
