[package]
name = "crepuscularity-reactive"
version = "0.1.0"
edition = "2021"
license = "MPL-2.0"
description = "Reactive signals for Crepuscularity WASM clients (UNSTABLE; in active development)."
repository = "https://github.com/semitechnological/crepuscularity"
readme = "../../README.md"

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = []
dom = ["dep:web-sys", "dep:wasm-bindgen", "dep:js-sys"]

[dependencies]
serde_json = { workspace = true }
web-sys = { workspace = true, optional = true, features = [
    "Document",
    "Element",
    "HtmlElement",
    "Window",
    "DomTokenList",
    "Node",
] }
wasm-bindgen = { workspace = true, optional = true }
js-sys = { workspace = true, optional = true }
