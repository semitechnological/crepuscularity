[package]
name = "crepuscularity-webext"
version = "0.1.0"
edition = "2021"
description = "Browser extension (MV3) support for Crepuscularity — UNSTABLE; in active development."
license = "MPL-2.0"
repository = "https://github.com/semitechnological/crepuscularity"
readme = "../../README.md"

[dependencies]
crepuscularity-core = { path = "../crepuscularity-core", version = "0.3.0" }
crepuscularity-web = { path = "../crepuscularity-web", version = "0.3.0" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"
notify = "8"
