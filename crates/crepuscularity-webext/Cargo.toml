[package]
name = "crepuscularity-webext"
version = "0.1.0"
edition = "2021"
description = "Browser extension capabilities for Crepuscularity - opt-in permissions with auto-detection"
license = "MIT"

[dependencies]
crepuscularity-core = { path = "../crepuscularity-core" }
crepuscularity-web  = { path = "../crepuscularity-web" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"
notify = "8"
