[package]
name = "crepuscularity-tui"
version = "0.4.3"
edition = "2021"
license = "MPL-2.0"
description = "Ratatui backend for the Crepuscularity .crepus DSL — write full-screen terminal UIs with nested div layouts."
repository = "https://github.com/tschk/crepuscularity"
readme = "../../README.md"

[dependencies]
crepuscularity-core = { path = "../crepuscularity-core", version = "0.4.7" }
crepuscularity_macros = { path = "../crepuscularity_macros", version = "0.5.1" }
notify = { workspace = true }
ratatui = { workspace = true }

[dev-dependencies]
ratatui = { workspace = true }
tempfile = { workspace = true }
