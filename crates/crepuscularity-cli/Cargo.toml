[package]
name = "crepuscularity-cli"
version = "0.7.11"
edition = "2021"
license = "MPL-2.0"
description = "crepus CLI — scaffolding and builds for Crepuscularity (UNSTABLE; in active development)."
repository = "https://github.com/semitechnological/crepuscularity"
documentation = "https://docs.rs/crepuscularity-cli"
readme = "../../README.md"

[[bin]]
name = "crepus"
path = "src/main.rs"

[[test]]
name = "web_cli"
path = "tests/web_cli.rs"

[[test]]
name = "benchmark_cli"
path = "tests/benchmark_cli.rs"

[[test]]
name = "embedded_cli"
path = "tests/embedded_cli.rs"

[[test]]
name = "embedded_check_cli"
path = "tests/embedded_check_cli.rs"

[features]
# Desktop (GPUI) commands: `crepus new`, `crepus dev`, `crepus preview`.
# Enabled by default. Disable for cross-compilation to platforms where GPUI
# (and its DirectX/Metal shaders) cannot be compiled.
default = ["desktop"]
desktop = ["dep:gpui", "dep:crepuscularity-runtime"]

[dependencies]
gpui                   = { version = "=0.2.2", default-features = false, features = ["font-kit"], optional = true }
crepuscularity-core    = { path = "../crepuscularity-core", version = "0.4.7" }
crepuscularity-runtime = { path = "../crepuscularity-runtime", version = "0.4.4", optional = true }
crepuscularity-tui     = { path = "../crepuscularity-tui", version = "0.4.3" }
crepuscularity-web     = { path = "../crepuscularity-web", version = "0.4.1" }
crepuscularity-webext  = { path = "../crepuscularity-webext", version = "0.2.2" }
crepuscularity-native  = { path = "../crepuscularity-native", version = "0.4.3" }
crepuscularity-embedded = { path = "../crepuscularity-embedded", version = "0.1.8" }
notify                 = { workspace = true }
walkdir                = { workspace = true }
serde                  = { workspace = true }
serde_json             = { workspace = true }
toml                   = { workspace = true }
console                = { workspace = true }
indicatif              = { workspace = true }
tracing                = { workspace = true }
tracing-subscriber     = { workspace = true }
 rayon                  = { workspace = true }
ratatui = { version = "0.29", default-features = false, features = ["crossterm"] }
pulldown-cmark = "0.11"

[dev-dependencies]
tempfile = { workspace = true }
