[package]
name = "crepuscularity-cli"
version = "0.3.0"
edition = "2021"

[[bin]]
name = "crepus"
path = "src/main.rs"

[dependencies]
gpui                   = { workspace = true }
crepuscularity-runtime = { path = "../crepuscularity-runtime" }
crepuscularity-webext  = { path = "../crepuscularity-webext" }
notify                 = "6"
serde                  = { version = "1", features = ["derive"] }
serde_json             = "1"
