[package]
name = "crepuscularity-cli"
version = "0.3.2"
edition = "2021"

[[bin]]
name = "crepus"
path = "src/main.rs"

[dependencies]
gpui                   = { workspace = true }
crepuscularity-core    = { path = "../crepuscularity-core" }
crepuscularity-runtime = { path = "../crepuscularity-runtime" }
crepuscularity-web     = { path = "../crepuscularity-web" }
crepuscularity-webext  = { path = "../crepuscularity-webext" }
notify                 = "8"
serde                  = { version = "1", features = ["derive"] }
serde_json             = "1"
console                = "0.16"
indicatif              = "0.18"
