[package]
name = "crepuscularity-gpui"
version = "0.4.1"
edition = "2021"
license = "MPL-2.0"
description = "GPUI backend for Crepuscularity (view! macro re-exports) — UNSTABLE; in active development."
repository = "https://github.com/tschk/crepuscularity"
documentation = "https://docs.rs/crepuscularity-gpui"
readme = "../../README.md"

[lib]
path = "src/lib.rs"

[features]
default = []
gpui-text-extras = [
    "crepuscularity_macros/gpui_text_run_styles",
    "crepuscularity-runtime/gpui_text_run_styles",
]
symbols = ["dep:gpui-symbols"]

[dependencies]
gpui = { version = "=0.2.2", default-features = false, features = ["font-kit"] }
crepuscularity-core = { path = "../crepuscularity-core", version = "0.4.9" }
crepuscularity_macros = { path = "../crepuscularity_macros", version = "0.5.2" }
crepuscularity-runtime = { path = "../crepuscularity-runtime", version = "0.4.6" }
gpui-symbols = { version = "0.6", optional = true }
