[package]
name = "crepuscularity-gpui"
version = "0.4.6"
edition = "2021"
license = "MPL-2.0"
description = "GPUI backend for Crepuscularity (view! macro re-exports) — UNSTABLE; in active development."
repository = "https://github.com/tschk/crepuscularity"
documentation = "https://docs.rs/crepuscularity-gpui"
readme = "../../README.md"

[lib]
path = "src/lib.rs"

[features]
default = ["font-kit"]
font-kit = ["gpui/font-kit"]
full-gpui = ["gpui/default"]
inspector = ["gpui/inspector"]
leak-detection = ["gpui/leak-detection"]
screen-capture = ["gpui/screen-capture"]
runtime-shaders = ["gpui/runtime_shaders"]
test-support = ["gpui/test-support"]
input-latency-histogram = []
wayland = ["gpui/wayland"]
x11 = ["gpui/x11"]
windows-manifest = ["gpui/windows-manifest"]
gpui-text-extras = [
    "crepuscularity_macros/gpui_text_run_styles",
    "crepuscularity-runtime/gpui_text_run_styles",
]
symbols = ["dep:gpui-symbols"]

[dependencies]
gpui = { version = "=0.2.2", default-features = false }
crepuscularity-core = { path = "../crepuscularity-core", version = "0.4.15" }
crepuscularity_macros = { path = "../crepuscularity_macros", version = "0.5.4" }
crepuscularity-runtime = { path = "../crepuscularity-runtime", version = "0.4.10" }
gpui-symbols = { version = "0.6", optional = true }
hdrhistogram = "7"
log = "0.4"
pollster = "0.4"
schemars = "1"
serde = { version = "1", features = ["derive"] }
