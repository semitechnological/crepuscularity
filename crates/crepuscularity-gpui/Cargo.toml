[package]
name = "crepuscularity-gpui"
version = "0.5.6"
edition = "2021"
license = "MPL-2.0"
description = "GPUI backend for Crepuscularity (view! macro re-exports) — UNSTABLE; in active development."
repository = "https://github.com/tschk/crepuscularity"
documentation = "https://docs.rs/crepuscularity-gpui"
readme = "../../README.md"

[lib]
path = "src/lib.rs"

[features]
# Default enables font-kit (cross-platform) but NO platform backend.
# You must enable at least one of: wayland, x11, macos, or windows.
default = ["font-kit"]
font-kit = ["gpui/font-kit"]
full-gpui = ["gpui/default"]
# Platform backends (choose at least one for your target)
wayland = ["gpui/wayland"]                                    # Linux Wayland
x11 = ["gpui/x11", "dep:xkbcommon", "xkbcommon/x11"]          # Linux X11
macos = ["gpui/macos-blade"]                                   # macOS (Metal)
windows = ["gpui/windows-manifest"]                            # Windows
# Cross-platform extras
inspector = ["gpui/inspector"]
leak-detection = ["gpui/leak-detection"]
screen-capture = ["gpui/screen-capture"]
runtime-shaders = ["gpui/runtime_shaders"]
test-support = ["gpui/test-support"]
gpui-text-extras = [
    "crepuscularity_macros/gpui_text_run_styles",
    "crepuscularity-runtime/gpui_text_run_styles",
]
symbols = ["dep:gpui-symbols"]

[dependencies]
gpui = { version = "=0.2.2", default-features = false }
xkbcommon = { version = "0.8", default-features = false, features = ["wayland"], optional = true }
crepuscularity-core = { path = "../crepuscularity-core", version = "0.4.23" }
crepuscularity_macros = { path = "../crepuscularity_macros", version = "0.5.9" }
crepuscularity-runtime = { path = "../crepuscularity-runtime", version = "0.4.16" }
gpui-symbols = { version = "0.6", optional = true }
pollster = "0.4"
