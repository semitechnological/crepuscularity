[package]
name = "crepuscularity-web"
version = "0.4.13"
edition = "2021"
license = "MPL-2.0"
description = "Web / SSR / DOM integration for Crepuscularity (UNSTABLE; in active development)."
repository = "https://github.com/tschk/crepuscularity"
documentation = "https://docs.rs/crepuscularity-web"
readme = "../../README.md"

[package.metadata.docs.rs]
# Document APIs behind optional integrations (GPUI-free default still builds on docs.rs Linux).
all-features = true

[features]
default = ["ssr"]
dom = ["dep:js-sys", "dep:wasm-bindgen", "dep:web-sys"]
parallel = ["dep:rayon"]
hydration = ["dep:base64"]
ssr = ["dep:base64"]
reactive = ["dep:crepuscularity-reactive", "crepuscularity-reactive/dom"]

[dependencies]
ammonia = "4.1.3"
base64 = { workspace = true, optional = true }
crepuscularity-core = { path = "../crepuscularity-core", version = "0.4.20" }
crepuscularity_macros = { path = "../crepuscularity_macros", version = "0.5.4" }
crepuscularity-reactive = { path = "../crepuscularity-reactive", version = "0.1.5", optional = true }
js-sys = { workspace = true, optional = true }
rayon = { workspace = true, optional = true }
serde_json = { workspace = true }
tracing = { workspace = true }
wasm-bindgen = { workspace = true, optional = true }
web-sys = { workspace = true, optional = true, features = ["Document", "Element", "HtmlElement", "Node", "Window"] }

[dev-dependencies]
tempfile = { workspace = true }
wasm-bindgen-test = "0.3.76"

[[test]]
name = "ssr"
path = "tests/ssr.rs"
required-features = ["ssr"]
