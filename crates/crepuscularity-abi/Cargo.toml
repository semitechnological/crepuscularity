[package]
name = "crepuscularity-abi"
version = "0.1.12"
edition = "2021"
license = "ISC"
description = "Plain C ABI for Crepuscularity View IR sessions."
repository = "https://github.com/tschk/crepuscularity"
documentation = "https://docs.rs/crepuscularity-abi"
readme = "../../README.md"

[lib]
crate-type = ["cdylib", "rlib"]



[dependencies]
crepuscularity-core = { path = "../crepuscularity-core", version = "0.4.25" }
crepuscularity-native = { path = "../crepuscularity-native", version = "0.5.14" }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
