[package]
name = "crepuscularity-runtime"
version = "0.3.1"
edition = "2021"
license = "MPL-2.0"
description = "Runtime parser, GPUI renderer, and hot-reload engine for Crepuscularity (UNSTABLE; in active development)."
repository = "https://github.com/semitechnological/crepuscularity"
documentation = "https://docs.rs/crepuscularity-runtime"
readme = "../../README.md"

[features]
default = []
# See `crepuscularity_macros` / gpui_text_run_styles — stock crates.io gpui 0.2.2 lacks these APIs.
gpui_text_run_styles = []

[dependencies]
crepuscularity-core = { path = "../crepuscularity-core", version = "0.3.1" }
# Pinned: `cargo publish` widens inherited `0.2.2` to `0.2`, which resolves to 0.2.1 (no `Div::hidden`).
gpui = { version = "=0.2.2", default-features = false, features = ["font-kit"] }
notify = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }
