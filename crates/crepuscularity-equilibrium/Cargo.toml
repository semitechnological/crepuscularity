[package]
name = "crepuscularity-equilibrium"
version = "0.1.0"
edition = "2021"
description = "Automatic C FFI generation for crepuscularity - compile V, Zig, C++, C# to C and generate bindings"
license = "MIT"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
which = "6"
tempfile = "3"

