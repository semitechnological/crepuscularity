[package]
name = "unthought-sites"
version = "0.1.0"
edition = "2021"
description = "Unthought site builder using Crepuscularity templates"
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "unthought-sites"
path = "src/bin/unthought-sites.rs"

[features]
default = []
parallel = ["crepuscularity-web/parallel"]
wasm = ["wasm-bindgen", "console_error_panic_hook"]

[dependencies]
crepuscularity-core = { path = "../crepuscularity-core" }
crepuscularity-web = { path = "../crepuscularity-web" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
atty = "0.2"

# WASM dependencies (optional)
wasm-bindgen = { version = "0.2", optional = true }
console_error_panic_hook = { version = "0.1", optional = true }

[dev-dependencies]
pretty_assertions = "1"
