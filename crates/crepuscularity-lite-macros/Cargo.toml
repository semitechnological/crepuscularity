[package]
name = "crepuscularity-lite-macros"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Proc-macro declarative UI DSL for crepuscularity-lite (GPUI shell)."
repository = "https://github.com/tschk/crepuscularity"

[features]
default = []
gpui_text_run_styles = []

[lib]
proc-macro = true
path = "src/lib.rs"

[dependencies]
crepuscularity-core = { path = "../crepuscularity-core", version = "0.4.9" }
proc-macro2 = { workspace = true }
quote = { workspace = true }
syn = { workspace = true }
