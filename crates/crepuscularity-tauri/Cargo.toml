[package]
name = "crepuscularity-tauri"
version = "0.1.0"
edition = "2021"
license = "MPL-2.0"
description = "Tauri v1/v2 static-bundle adapter for Crepuscularity."
repository = "https://github.com/tschk/crepuscularity"

[features]
default = []
mobile = ["native"]
native = ["dep:crepuscularity-native"]
desktop = ["native"]
full = ["mobile", "desktop"]

[dependencies]
crepuscularity-core = { path = "../crepuscularity-core", version = "0.4.19" }
crepuscularity-native = { path = "../crepuscularity-native", version = "0.5.7", optional = true }
serde_json = { workspace = true }
serde = { workspace = true }
toml = { workspace = true }
json5 = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
