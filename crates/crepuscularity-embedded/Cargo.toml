[package]
name = "crepuscularity-embedded"
version = "0.1.8"
edition = "2021"
license = "MPL-2.0"
description = "UNSTABLE: embedded RGB565 framebuffer rendering for .crepus (in active development and testing)."
repository = "https://github.com/semitechnological/crepuscularity"
readme = "../../README.md"

[features]
default = ["std"]
std = ["dep:crepuscularity-core"]
macros = ["dep:crepuscularity-embedded-macros"]
mipidsi = [
    "dep:mipidsi",
    "dep:display-interface",
    "dep:display-interface-spi",
    "dep:embedded-graphics",
    "dep:embedded-hal",
]
embassy-stm32 = [
    "mipidsi",
    "dep:embassy-stm32",
    "dep:embassy-time",
    "dep:embassy-embedded-hal",
    "dep:embassy-sync",
    "dep:static_cell",
]
esp-idf = ["dep:esp-idf-sys"]

[dependencies]
crepuscularity-core = { path = "../crepuscularity-core", version = "0.4.6", optional = true }
crepuscularity-embedded-macros = { path = "../crepuscularity-embedded-macros", version = "0.1.0", optional = true }
mipidsi = { version = "0.8.0", optional = true }
display-interface = { version = "0.5.0", optional = true }
display-interface-spi = { version = "0.5.0", optional = true }
embedded-graphics = { version = "0.8.1", optional = true }
embedded-hal = { version = "1.0.0", optional = true }
embassy-stm32 = { version = "0.6.0", optional = true }
embassy-time = { version = "0.5.1", optional = true }
embassy-embedded-hal = { version = "0.6.0", default-features = false, optional = true }
embassy-sync = { version = "0.8.0", optional = true }
static_cell = { version = "2.1.0", optional = true }
esp-idf-sys = { version = "0.36", optional = true, default-features = false }

[dev-dependencies]
crepuscularity-core = { path = "../crepuscularity-core", version = "0.4.6" }
tempfile = { workspace = true }
sha2 = { workspace = true }
