[package]
name = "crepuscularity-ssr"
version = "0.3.0"
edition = "2021"
license = "MPL-2.0"
description = "Axum/Tokio SSR helpers for Crepuscularity — server-side renders .crepus templates."
repository = "https://github.com/tschk/crepuscularity"
documentation = "https://docs.rs/crepuscularity-ssr"
readme = "../../README.md"

[dependencies]
crepuscularity-web = { path = "../crepuscularity-web", version = "0.4.7" }
crepuscularity-core = { path = "../crepuscularity-core", version = "0.4.15" }
axum = { workspace = true }
tokio = { workspace = true, features = ["sync"] }
tokio-stream = { workspace = true }
http = { workspace = true }
tracing = { workspace = true }
