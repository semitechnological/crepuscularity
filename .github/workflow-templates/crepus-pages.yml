name: Crepus Pages

on:
  push:
    branches: [$default-branch]
  pull_request:
    branches: [$default-branch]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: crepus-pages
  cancel-in-progress: true

env:
  CREPUS_MANIFEST: crepus.toml
  CREPUS_TARGET: site

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v5

      - name: Setup Crepuscularity
        uses: tschk/crepuscularity/.github/actions/setup-crepuscularity@main
        with:
          rust-version: stable
          cache: true
          wasm: true
          install-cli: true

      - name: Build site
        run: crepus web build --manifest "$CREPUS_MANIFEST" --target "$CREPUS_TARGET"

      - name: Verify site artifact
        run: |
          test -f dist/index.html
          test -f dist/.nojekyll
          test -d dist/pkg

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
