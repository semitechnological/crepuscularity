name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test Suite
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        rust: [stable]
    
    steps:
    - uses: actions/checkout@v4

    - name: Install Rust
      uses: dtolnay/rust-toolchain@master
      with:
        toolchain: ${{ matrix.rust }}
    
    - name: Cache cargo registry
      uses: actions/cache@v4
      with:
        path: ~/.cargo/registry
        key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}
    
    - name: Cache cargo index
      uses: actions/cache@v4
      with:
        path: ~/.cargo/git
        key: ${{ runner.os }}-cargo-git-${{ hashFiles('**/Cargo.lock') }}
    
    - name: Cache cargo build
      uses: actions/cache@v4
      with:
        path: target
        key: ${{ runner.os }}-cargo-build-target-${{ hashFiles('**/Cargo.lock') }}
    
    - name: Set SDKROOT (macOS)
      if: runner.os == 'macOS'
      run: echo "SDKROOT=$(xcrun --show-sdk-path)" >> $GITHUB_ENV

    - name: WASM target and wasm-bindgen (crepus web build integration tests)
      run: |
        rustup target add wasm32-unknown-unknown
        cargo install wasm-bindgen-cli --locked
      shell: bash
    
    - name: Run tests
      run: cargo test --workspace

    - name: Run clippy
      run: cargo clippy --workspace -- -D warnings
      if: matrix.os == 'ubuntu-latest'

  build-examples:
    name: Build Examples
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    
    steps:
    - uses: actions/checkout@v4

    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable
    
    - name: Set SDKROOT (macOS)
      if: runner.os == 'macOS'
      run: echo "SDKROOT=$(xcrun --show-sdk-path)" >> $GITHUB_ENV
    
    - name: Build weather example
      run: cargo build
      working-directory: examples/weather
      if: runner.os != 'Windows'
    
    - name: Build CLI
      run: cargo build --package crepuscularity-cli

  docs:
    name: Documentation
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4

    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable
    
    - name: Build docs (strict rustdoc)
      run: cargo doc --no-deps --workspace
      env:
        RUSTDOCFLAGS: -D warnings
