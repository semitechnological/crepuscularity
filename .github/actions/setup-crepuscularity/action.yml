name: 'Setup Crepuscularity'
description: 'Install and configure crepuscularity for GPUI development'
branding:
  icon: 'zap'
  color: 'purple'

inputs:
  rust-version:
    description: 'Rust toolchain version'
    required: false
    default: 'stable'
  cache:
    description: 'Enable cargo caching'
    required: false
    default: 'true'
  install-cli:
    description: 'Install the crepus CLI from the crepuscularity repository'
    required: false
    default: 'false'
  wasm:
    description: 'Install the wasm32 target and wasm-bindgen-cli for crepus web builds'
    required: false
    default: 'false'
  wasm-bindgen-version:
    description: 'wasm-bindgen-cli version'
    required: false
    default: '0.2.121'

runs:
  using: 'composite'
  steps:
    - name: Install Rust
      uses: dtolnay/rust-toolchain@master
      with:
        toolchain: ${{ inputs.rust-version }}

    - name: Set SDKROOT (macOS)
      if: runner.os == 'macOS'
      shell: bash
      run: echo "SDKROOT=$(xcrun --show-sdk-path)" >> $GITHUB_ENV

    - name: Cache cargo registry
      if: inputs.cache == 'true'
      uses: actions/cache@v4
      with:
        path: ~/.cargo/registry
        key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}

    - name: Cache cargo index
      if: inputs.cache == 'true'
      uses: actions/cache@v4
      with:
        path: ~/.cargo/git
        key: ${{ runner.os }}-cargo-git-${{ hashFiles('**/Cargo.lock') }}

    - name: Cache cargo build
      if: inputs.cache == 'true'
      uses: actions/cache@v4
      with:
        path: target
        key: ${{ runner.os }}-cargo-build-${{ hashFiles('**/Cargo.lock') }}

    - name: Install WASM tooling
      if: inputs.wasm == 'true'
      shell: bash
      run: |
        rustup target add wasm32-unknown-unknown
        cargo install wasm-bindgen-cli --version "${{ inputs.wasm-bindgen-version }}" --locked

    - name: Install crepuscularity CLI
      if: inputs.install-cli == 'true'
      shell: bash
      run: |
        if ! command -v crepus &> /dev/null; then
          cargo install --git https://github.com/tschk/crepuscularity crepuscularity-cli --locked
        fi

    - name: Verify installation
      shell: bash
      run: |
        echo "✓ Rust: $(rustc --version)"
        echo "✓ Cargo: $(cargo --version)"
        if command -v crepus &> /dev/null; then
          echo "✓ crepus CLI installed"
        fi
        if command -v wasm-bindgen &> /dev/null; then
          echo "✓ wasm-bindgen: $(wasm-bindgen --version)"
        fi
